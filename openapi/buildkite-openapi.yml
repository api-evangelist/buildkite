components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token issued from your Buildkite Personal Access Tokens page.
  parameters:
    Org:
      name: org
      in: path
      required: true
      description: Organization slug.
      schema:
        type: string
    PipelineSlug:
      name: slug
      in: path
      required: true
      description: Pipeline slug.
      schema:
        type: string
    BuildNumber:
      name: number
      in: path
      required: true
      description: Build number.
      schema:
        type: integer
    JobId:
      name: jobId
      in: path
      required: true
      description: Job ID.
      schema:
        type: string
    ClusterId:
      name: clusterId
      in: path
      required: true
      description: Cluster ID.
      schema:
        type: string
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        url:
          type: string
        web_url:
          type: string
        pipelines_url:
          type: string
        agents_url:
          type: string
        emojis_url:
          type: string
        created_at:
          type: string
          format: date-time
    Member:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        sso_mode_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    Pipeline:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        web_url:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        repository:
          type: string
        cluster_id:
          type: string
        branch_configuration:
          type: string
        default_branch:
          type: string
        skip_queued_branch_builds:
          type: boolean
        provider:
          type: object
        builds_url:
          type: string
        badge_url:
          type: string
        created_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
    PipelineCreate:
      type: object
      required: [name, repository]
      properties:
        name:
          type: string
        repository:
          type: string
        cluster_id:
          type: string
        configuration:
          type: string
        default_branch:
          type: string
        description:
          type: string
    Build:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        web_url:
          type: string
        number:
          type: integer
        state:
          type: string
        message:
          type: string
        commit:
          type: string
        branch:
          type: string
        env:
          type: object
        author:
          type: object
        creator:
          $ref: "#/components/schemas/User"
        source:
          type: string
        created_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
    BuildCreate:
      type: object
      required: [commit, branch]
