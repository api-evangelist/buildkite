specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Buildkite
providerId: buildkite
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- DevOps
- CI/CD
- Pipelines
- Agents
- Self-Hosted
- Rate Limiting
- Quotas
- Throttling
description: >-
  Buildkite enforces per-token rate limits on the REST and GraphQL APIs and
  returns 429 with the standard rate-limit response headers. Specific numeric
  ceilings are not enumerated in public docs; Buildkite advises retrying after
  a short delay and uses Retry-After.
notes: >-
  Numeric per-window quotas are not published; reconciled flagged false.
  Concurrency at the build level is governed by plan (Personal: 3 concurrent
  jobs, Pro/Enterprise: unlimited subject to agent / hosted-minute caps).
sources:
- https://buildkite.com/docs/apis/rest-api
- https://buildkite.com/pricing
responseCodes:
  throttled: 429
headers:
- name: RateLimit-Limit
  description: Per-window quota (when present).
- name: RateLimit-Remaining
  description: Calls remaining in window.
- name: Retry-After
  description: Seconds to wait before retrying after a 429.
limits:
- name: REST API per token
  scope: api_token
  metric: requests
  limit: see Buildkite docs
  notes: Public numeric ceiling not documented; 429 with Retry-After on throttle.
- name: GraphQL API per token
  scope: api_token
  metric: requests
  limit: see Buildkite docs
  notes: Same 429 contract; complex queries are bounded by depth/cost limits.
- name: Concurrent jobs (Personal)
  scope: organization
  metric: concurrent_jobs
  limit: 3
  notes: Free plan; Pro/Enterprise are unlimited subject to agents/minutes.
policies:
- name: Backoff Strategy
  description: Honor Retry-After on 429; use exponential backoff with jitter.
- name: Token Scoping
  description: Limit access tokens to required scopes; rotate regularly.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
