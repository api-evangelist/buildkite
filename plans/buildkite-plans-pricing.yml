description: >-
  Buildkite offers three primary tiers — Personal (Free), Pro and Enterprise —
  plus a 30-day All Access trial. Pricing is per active user per month with
  generous self-hosted-agent allowances; managed (hosted) agent compute and
  Test Engine test executions are metered separately on top.
notes: >-
  Pricing as of 2026-05-08. The Pro tier includes 10 self-hosted agents and
  $2.50/agent/mo above; Pro also includes 2,000 Linux vCPU minutes/mo of hosted
  compute and 250 managed test executions before overages.
